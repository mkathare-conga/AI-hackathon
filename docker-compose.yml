services:
  postgres:
    image: postgres:16-alpine
    container_name: revenue-leakage-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revenue_leakage}
      POSTGRES_USER: ${POSTGRES_USER:-revenue_leakage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revenue_leakage}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revenue_leakage} -d ${POSTGRES_DB:-revenue_leakage}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z
    container_name: revenue-leakage-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: revenue-leakage-minio-bootstrap
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-contract-documents}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio';
        sleep 1;
      done;
      mc mb --ignore-existing local/$$OBJECT_STORE_BUCKET;
      mc anonymous set private local/$$OBJECT_STORE_BUCKET;
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: revenue-leakage-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://revenue_leakage:revenue_leakage@postgres:5432/revenue_leakage}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://minio:9000}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-minioadmin}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-minioadmin}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-contract-documents}
      OBJECT_STORE_SECURE: ${OBJECT_STORE_SECURE:-false}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_CHAT_COMPLETIONS_URL: ${AI_CHAT_COMPLETIONS_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: revenue-leakage-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  postgres-data:
  minio-data:

